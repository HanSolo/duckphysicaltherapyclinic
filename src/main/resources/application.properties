# HTTP
quarkus.http.port=8082
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true

# Database: H2 file database, so appointments survive restarts. The container overrides the URL to /data/clinic (see compose.yaml).
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/clinic;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=update

# MCP server (Streamable HTTP, endpoint /mcp). Stateless clients (spec 2026-07-28) and older stateful clients are served on the same endpoint.
quarkus.mcp.server.server-info.name=duck-physical-therapy-clinic
quarkus.mcp.server.server-info.version=1.0.0

# Tests use a throw-away in-memory database
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:clinictest;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# ---- Agent: language model (local Ollama or Claude), the other agents, and the shared secret for the insurer's partner tools ----
# The container gets the LLM_* values from llm.env (same file and names as DuckInsurance and the DuckClinic), see compose.yaml.
# LLM_PROVIDER: ollama (native /api/chat), anthropic (Messages API /v1/messages, alias claude) or openai (Chat Completions {base}/chat/completions)
duck.llm.provider=${LLM_PROVIDER:ollama}
duck.llm.base-url=${LLM_BASE_URL:http://localhost:11434}
duck.llm.api-key=${LLM_API_KEY:ollama}
# 0 = not set: anthropic then uses 4096, openai sends no limit (newer OpenAI models reject max_tokens)
duck.llm.max-tokens=${LLM_MAX_TOKENS:0}
duck.llm.model=${LLM_MODEL:qwen3.8:27b}
duck.llm.timeout-seconds=240
duck.insurer.mcp-url=${INSURER_MCP_URL:http://localhost:8081/api/mcp}
duck.clinic.mcp-url=${DUCKCLINIC_MCP_URL:http://localhost:8080/duck-clinic/api/mcp}
duck.agent.secret=${AGENT_SECRET:duck-agent-demo}
